name: Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar el proyecto
        run: ./gradlew assembleDebug

  test:
    name: Unit Test & Coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ejecutar Tests Unitarios y JaCoCo
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest jacocoTestReport

      - name: Subir reporte de JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/jacocoTestReport/html/

  e2e:
    name: E2E Tests (Espresso)
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ejecutar pruebas Espresso en Emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: aarch64
          profile: Nexus 6
          script: |
            chmod +x ./gradlew
            ./gradlew connectedDebugAndroidTest

  deploy:
    name: Deploy
    needs: [build, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Despliegue Simulado (Continuous Deployment)
        run: echo "Desplegando en Firebase App Distribution (Simulado) porque todos los jobs anteriores fueron exitosos."
